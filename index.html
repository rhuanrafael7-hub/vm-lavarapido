<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigatti Estética Automotiva - Agendamento Online</title>

  <!-- Google Fonts: Montserrat & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #121214;
      --bg-card: #1e1e24;
      --primary: #ff6b00;
      --primary-hover: #e05d00;
      --accent-red: #e63946;
      --accent-red-hover: #c92a37;
      --text-white: #ffffff;
      --text-muted: #a0a0b0;
      --border-color: #2e2e38;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-orange: 0 8px 24px rgba(255, 107, 0, 0.25);
      --shadow-red: 0 8px 24px rgba(230, 57, 70, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); line-height: 1.6; padding-bottom: 60px; }

    header {
      background: linear-gradient(135deg, #1a0a00 0%, #2a1200 50%, #121214 100%);
      border-bottom: 3px solid var(--accent-red);
      padding: 50px 20px;
      text-align: center;
    }

    .badge-red {
      display: inline-block; background-color: var(--accent-red); color: var(--text-white);
      font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 15px; box-shadow: var(--shadow-red);
    }

    h1 { font-family: 'Montserrat', sans-serif; font-size: 2.3rem; font-weight: 900; color: var(--text-white); text-transform: uppercase; margin-bottom: 10px; }
    h1 span { color: var(--accent-red); }
    p.subtitle { color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto; }

    .container { max-width: 1100px; margin: 40px auto 0; padding: 0 20px; }
    .section-title {
      font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 800; text-transform: uppercase;
      margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: var(--text-white);
      border-left: 4px solid var(--accent-red); padding-left: 12px;
    }

    /* FILTRO DE CATEGORIAS */
    .filter-container {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px;
    }
    .filter-btn {
      background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 10px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 0.9rem; transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-red); border-color: var(--accent-red); color: #ffffff; box-shadow: var(--shadow-red);
    }

    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 50px; }
    .service-card {
      background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease;
    }
    .service-card:hover { transform: translateY(-5px); border-color: var(--accent-red); box-shadow: var(--shadow-red); }
    .service-card h3 { font-family: 'Montserrat', sans-serif; font-size: 1.15rem; margin-bottom: 8px; color: var(--text-white); }
    
    .service-details { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; border-left: 2px solid var(--border-color); padding-left: 8px; }
    .service-details p { margin-bottom: 4px; }
    .service-details strong { color: #ddd; }

    .vehicle-prices {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; background: var(--bg-dark); padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); text-align: center;
    }
    .v-price-item span { display: block; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    .v-price-item strong { font-size: 0.85rem; color: var(--primary); font-family: 'Montserrat', sans-serif; }

    .service-price-box {
      font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--primary);
      background-color: rgba(255, 107, 0, 0.1); padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid rgba(255, 107, 0, 0.2); text-align: center;
    }

    .booking-card, .reviews-section {
      background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 35px; margin-bottom: 50px;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; }
    input[type="text"], input[type="tel"], input[type="date"], input[type="password"], input[type="number"], select, textarea {
      width: 100%; padding: 14px 16px; background-color: var(--bg-dark); border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); color: var(--text-white); font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-red); }

    /* SELETOR DE DIAS */
    .date-scroll-container {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px;
      scrollbar-width: thin; scrollbar-color: var(--accent-red) var(--bg-dark);
    }
    .date-scroll-container::-webkit-scrollbar { height: 6px; }
    .date-scroll-container::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 4px; }

    .date-card {
      background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      min-width: 90px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; justify-content: center; gap: 4px; color: var(--text-white);
    }
    .date-card .day-name { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .date-card .day-num { font-size: 1.2rem; font-family: 'Montserrat', sans-serif; font-weight: 800; }
    .date-card .month-name { font-size: 0.75rem; text-transform: uppercase; color: var(--accent-red); font-weight: 700; }
    .date-card:hover { border-color: var(--accent-red); }
    .date-card.active { background-color: var(--accent-red); border-color: var(--accent-red); box-shadow: var(--shadow-red); }
    .date-card.active .day-name, .date-card.active .month-name, .date-card.active .day-num { color: #ffffff; }

    .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
    .time-btn {
      background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-white);
      padding: 12px 5px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; text-align: center;
    }
    .time-btn.active { background-color: var(--accent-red); border-color: var(--accent-red); font-weight: 800; box-shadow: var(--shadow-red); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--accent-red) 0%, var(--accent-red-hover) 100%);
      color: #ffffff; border: none; padding: 18px; border-radius: var(--radius-sm);
      font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; cursor: pointer;
      box-shadow: var(--shadow-red); transition: filter 0.2s;
    }
    .btn-submit:hover { filter: brightness(1.1); }

    .rating-stars { display: flex; gap: 8px; font-size: 1.8rem; cursor: pointer; margin-bottom: 15px; }
    .star { color: #4a4a5a; }
    .star.active { color: #ffb703; }

    .reviews-list { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
    .review-item { background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 16px; }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .review-stars { color: #ffb703; }
    .review-text { color: var(--text-muted); font-size: 0.95rem; }

    .alert { padding: 15px; border-radius: var(--radius-sm); margin-bottom: 20px; display: none; font-weight: 600; }
    .alert-success { background-color: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }
    .alert-error { background-color: rgba(230, 57, 70, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }
  </style>
</head>
<body>

  <header>
    <div class="badge-red">Catálogo Oficial & Agendamento</div>
    <h1>VIGATTI <span>ESTÉTICA AUTOMOTIVA</span></h1>
    <p class="subtitle">Eleve a estética do seu carro ao próximo nível com atendimento profissional.</p>
  </header>

  <div class="container">

    <!-- FILTROS DE CATEGORIA -->
    <div class="filter-container">
      <button class="filter-btn active" onclick="filtrarCategoria('todos')">Todos os Serviços</button>
      <button class="filter-btn" onclick="filtrarCategoria('Lavagens')">Lavagens</button>
      <button class="filter-btn" onclick="filtrarCategoria('Polimentos')">Polimentos</button>
      <button class="filter-btn" onclick="filtrarCategoria('Proteções')">Proteções</button>
      <button class="filter-btn" onclick="filtrarCategoria('Higienizações')">Higienizações</button>
    </div>

    <!-- SERVIÇOS -->
    <h2 class="section-title">Nossos Serviços</h2>
    <div class="services-grid" id="servicesGrid"></div>

    <!-- AGENDAMENTO -->
    <div class="booking-card">
      <h2 class="section-title">Agendar Horário</h2>
      <div id="bookingAlert" class="alert"></div>

      <form id="bookingForm">
        <div class="form-group">
          <label for="clientName">Nome Completo</label>
          <input type="text" id="clientName" placeholder="Digite seu nome" required>
        </div>
        <div class="form-group">
          <label for="clientPhone">Telefone / WhatsApp</label>
          <input type="tel" id="clientPhone" placeholder="(00) 00000-0000" required>
        </div>
        
        <div class="form-group">
          <label for="selectVehicleType">Porte do Veículo</label>
          <select id="selectVehicleType" required onchange="atualizarPrecoSelecionado()">
            <option value="hatch">Hatch e Sedan</option>
            <option value="suv">SUV</option>
            <option value="pickup">Pick-up</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selectService">Selecione o Serviço</label>
          <select id="selectService" required onchange="atualizarPrecoSelecionado()">
            <option value="">Aguarde, carregando...</option>
          </select>
        </div>

        <div class="service-price-box" id="displayPrecoFinal">Valor Estimado: R$ 0,00</div>
        <br>

        <!-- SELETOR DE DATA -->
        <div class="form-group">
          <label>Data da Lavagem / Serviço</label>
          <div class="date-scroll-container" id="dateScrollContainer"></div>
          <input type="hidden" id="bookingDate" required>
        </div>

        <div class="form-group">
          <label>Horário Disponível</label>
          <div class="time-grid" id="timeGrid">
            <div class="time-btn" data-time="08:00">08:00</div>
            <div class="time-btn" data-time="09:00">09:00</div>
            <div class="time-btn" data-time="10:00">10:00</div>
            <div class="time-btn" data-time="11:00">11:00</div>
            <div class="time-btn" data-time="13:00">13:00</div>
            <div class="time-btn" data-time="14:00">14:00</div>
            <div class="time-btn" data-time="15:00">15:00</div>
            <div class="time-btn" data-time="16:00">16:00</div>
            <div class="time-btn" data-time="17:00">17:00</div>
          </div>
        </div>
        <button type="submit" class="btn-submit">CONFIRMAR AGENDAMENTO</button>
      </form>
    </div>

    <!-- AVALIAÇÕES -->
    <div class="reviews-section">
      <h2 class="section-title">Avaliações dos Clientes</h2>
      <div id="reviewAlert" class="alert"></div>

      <form id="reviewForm">
        <div class="form-group">
          <label for="reviewName">Seu Nome</label>
          <input type="text" id="reviewName" placeholder="Como quer ser identificado" required>
        </div>
        <div class="form-group">
          <label>Sua Nota</label>
          <div class="rating-stars" id="ratingStars">
            <span class="star active" data-value="1">★</span>
            <span class="star active" data-value="2">★</span>
            <span class="star active" data-value="3">★</span>
            <span class="star active" data-value="4">★</span>
            <span class="star active" data-value="5">★</span>
          </div>
        </div>
        <div class="form-group">
          <label for="reviewText">Comentário</label>
          <textarea id="reviewText" rows="3" placeholder="Conte como foi sua experiência..." required></textarea>
        </div>
        <button type="submit" class="btn-submit" style="background: var(--bg-dark); border: 1px solid var(--accent-red);">ENVIAR AVALIAÇÃO</button>
      </form>
      <div class="reviews-list" id="reviewsList"></div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://wvqeopieinpbturxlvjx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DDWHG2noJxiqEOw4l89KGg_BCvu1VBS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedTime = '';
    let selectedRating = 5;
    let listaServicosCache = [];

    // Base completa tirada diretamente do catálogo do seu cliente
    const servicosPadrao = [
      { id: 1, categoria: 'Lavagens', nome: 'LIMPEZA NÍVEL I', externa: 'Lavagem externa, Rodas, Vidros ext., Caixa de rodas/portas', interna: 'Aspiração, Tapetes, Painel, Forros, Vidros int., Plásticos int.', protecao: 'Cera 1 mês, Revitalizador plásticos int., Pretinho pneus', hatch: 100.00, suv: 120.00, pickup: 180.00 },
      { id: 2, categoria: 'Lavagens', nome: 'LIMPEZA NÍVEL II', externa: 'Revitalização plásticos ext., Lavagem externa, Emblemas, Rodas int/ext, Caixa de rodas', interna: 'Aspiração completa, Tapetes, Painel, Forros, Console, Plásticos int., Vidros int.', protecao: 'Revitalizador plásticos ext/int, Cera 2 meses, Selante pneus', hatch: 200.00, suv: 230.00, pickup: 280.00 },
      { id: 3, categoria: 'Lavagens', nome: 'LIMPEZA NÍVEL III', externa: 'Lavagem externa, Canaletas, Plásticos ext., Emblemas, Rodas int/ext, Churrasqueira, Escape', interna: 'Aspiração, Tapetes, Bancos, Painel, Volante/chave seta, Pedais, Teto', protecao: 'Revitalizador ext/int, Cera 3 meses, Impermeabilizante parabrisa/vidros, Selante pneus', hatch: 300.00, suv: 330.00, pickup: 380.00 },
      { id: 4, categoria: 'Polimentos', nome: 'POLIMENTO PARCIAL', externa: 'Limpeza Nível I inclusa', interna: 'Processos: Descontaminação, Correção de verniz, Remoção de 70% riscos profundos e 90% superficiais, Gloss intenso', protecao: 'Revitalizador ext/int, Cera 6 meses, Impermeabilizante parabrisa/vidros, Selante pneus', hatch: 450.00, suv: 500.00, pickup: 600.00 },
      { id: 5, categoria: 'Polimentos', nome: 'POLIMENTO TÉCNICO', externa: 'Limpeza Nível III inclusa', interna: 'Processos: Descontaminação de pintura, Isolamento, Correção de verniz, Remoção de 99% de riscos', protecao: 'Revitalizador ext/int, Cera 1 ano de proteção, Impermeabilizantes, Selante pneus', hatch: 800.00, suv: 900.00, pickup: 1000.00 },
      { id: 6, categoria: 'Polimentos', nome: 'POLIMENTO DOS FARÓIS', externa: 'Limpeza Nível I', interna: 'Processos: Correção e nivelamento de farol, Lixamento, Remoção de riscos profundos', protecao: 'Aplicação de Vitrificador 1 ano (Garantia de 1 ano)', hatch: 250.00, suv: 250.00, pickup: 250.00 },
      { id: 7, categoria: 'Proteções', nome: 'VITRIFICAÇÃO 3 ANOS', externa: 'Limpeza Nível III inclusa', interna: 'Processos: Descontaminação de pintura + Polimento Técnico', protecao: 'Revitalizador ext/int, Impermeabilizador de espelhos, Vitrificador 3 anos, Parabrisa/vidros', hatch: 1800.00, suv: 2000.00, pickup: 2300.00 },
      { id: 8, categoria: 'Proteções', nome: 'VITRIFICAÇÃO 5 ANOS', externa: 'Limpeza Nível III inclusa', interna: 'Processos: Descontaminação de pintura + Polimento Técnico avançado', protecao: 'Vitrificador 5 anos de proteção, Impermeabilizantes completos, Selante pneus', hatch: 2400.00, suv: 2600.00, pickup: 2900.00 },
      { id: 9, categoria: 'Higienizações', nome: 'HIGIENIZAÇÃO INTERNA', externa: 'Lavagem externa completa + Canaletas + Rodas int/ext + Churrasqueira + Escape', interna: 'Extração de carpetes e bancos com bactericida, Limpeza teto, pedais, volante, teto, odores', protecao: 'Revitalizador ext/int, Cera 3 meses, Selante pneus', hatch: 600.00, suv: 700.00, pickup: 800.00 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      carregarServicos('todos');
      carregarAvaliacoes();
      configurarHorarios();
      configurarEstrelas();
      gerarSeletorDeDias();
    });

    function filtrarCategoria(categoria) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      carregarServicos(categoria);
    }

    function gerarSeletorDeDias() {
      const container = document.getElementById('dateScrollContainer');
      container.innerHTML = '';
      const diasDaSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const mesesDoAno = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const ano = d.getFullYear();
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        const dataFormatada = `${ano}-${mes}-${dia}`;

        let nomeDia = diasDaSemana[d.getDay()];
        if (i === 0) nomeDia = 'Hoje';
        if (i === 1) nomeDia = 'Amanhã';

        const card = document.createElement('div');
        card.className = `date-card ${i === 0 ? 'active' : ''}`;
        card.innerHTML = `<span class="day-name">${nomeDia}</span><span class="day-num">${d.getDate()}</span><span class="month-name">${mesesDoAno[d.getMonth()]}</span>`;

        if (i === 0) document.getElementById('bookingDate').value = dataFormatada;

        card.addEventListener('click', () => {
          document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          document.getElementById('bookingDate').value = dataFormatada;
        });
        container.appendChild(card);
      }
    }

    async function carregarServicos(filtro) {
      const grid = document.getElementById('servicesGrid');
      const select = document.getElementById('selectService');

      // Tenta puxar do Supabase, se falhar usa o padrão do catálogo enviado
      let { data: servicos } = await _supabase.from('servicos').select('*');
      listaServicosCache = (!servicos || servicos.length === 0) ? servicosPadrao : servicos;

      grid.innerHTML = '';
      select.innerHTML = '<option value="">▼ ESCOLHA O SERVIÇO DESEJADO</option>';

      let filtrados = filtro === 'todos' ? listaServicosCache : listaServicosCache.filter(s => s.categoria === filtro);

      filtrados.forEach(s => {
        let hatch = Number(s.hatch || s.preco || 0).toFixed(2).replace('.', ',');
        let suv = Number(s.suv || s.preco || 0).toFixed(2).replace('.', ',');
        let pickup = Number(s.pickup || s.preco || 0).toFixed(2).replace('.', ',');

        grid.innerHTML += `
          <div class="service-card">
            <div>
              <span style="font-size: 0.7rem; color: var(--accent-red); font-weight: 700; text-transform: uppercase;">${s.categoria || 'Estética'}</span>
              <h3>${s.nome}</h3>
              <div class="service-details">
                ${s.externa ? `<p><strong>Externa:</strong> ${s.externa}</p>` : ''}
                ${s.interna ? `<p><strong>Interna/Processos:</strong> ${s.interna}</p>` : ''}
                ${s.protecao ? `<p><strong>Proteção:</strong> ${s.protecao}</p>` : ''}
              </div>
            </div>
            <div>
              <div class="vehicle-prices">
                <div class="v-price-item"><span>Hatch/Sedan</span><strong>R$ ${hatch}</strong></div>
                <div class="v-price-item"><span>SUV</span><strong>R$ ${suv}</strong></div>
                <div class="v-price-item"><span>Pick-up</span><strong>R$ ${pickup}</strong></div>
              </div>
            </div>
          </div>
        `;
        select.innerHTML += `<option value="${s.nome}">${s.nome} (Hatch: R$ ${hatch} | SUV: R$ ${suv} | Pick-up: R$ ${pickup})</option>`;
      });
      atualizarPrecoSelecionado();
    }

    function atualizarPrecoSelecionado() {
      const nomeServico = document.getElementById('selectService').value;
      const tipoVeiculo = document.getElementById('selectVehicleType').value;
      const display = document.getElementById('displayPrecoFinal');

      if (!nomeServico) {
        display.innerText = 'Valor Estimado: R$ 0,00';
        return;
      }

      const serv = listaServicosCache.find(s => s.nome === nomeServico);
      if (serv) {
        let preco = serv.hatch;
        if (tipoVeiculo === 'suv') preco = serv.suv;
        if (tipoVeiculo === 'pickup') preco = serv.pickup;
        if (!preco) preco = serv.preco || 0;
        display.innerText = `Valor Estimado para ${tipoVeiculo.toUpperCase()}: R$ ${Number(preco).toFixed(2).replace('.', ',')}`;
      }
    }

    function configurarHorarios() {
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedTime = btn.getAttribute('data-time');
        });
      });
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('bookingAlert');
      const nome = document.getElementById('clientName').value;
      const telefone = document.getElementById('clientPhone').value;
      const veiculo = document.getElementById('selectVehicleType').value;
      const servico = document.getElementById('selectService').value;
      const data = document.getElementById('bookingDate').value;

      if (!selectedTime) {
        exibirAlerta(alertBox, 'Selecione um horário!', 'error');
        return;
      }

      const servObj = listaServicosCache.find(s => s.nome === servico);
      let valorFinal = servObj ? (veiculo === 'suv' ? servObj.suv : veiculo === 'pickup' ? servObj.pickup : servObj.hatch) : 0;

      const { error } = await _supabase.from('agendamentos').insert([{ 
        nome, telefone, servico: `${servico} (${veiculo.toUpperCase()})`, data, horario: selectedTime 
      }]);

      if (error) {
        exibirAlerta(alertBox, 'Erro ao agendar: ' + error.message, 'error');
      } else {
        exibirAlerta(alertBox, 'Agendamento realizado! Redirecionando para o WhatsApp...', 'success');
        const [ano, mes, dia] = data.split('-');
        const dataFormatadaBr = `${dia}/${mes}/${ano}`;
        const whatsappDestino = '5516999999999'; // Altere para o WhatsApp do seu cliente

        const mensagem = `Olá! Gostaria de confirmar meu agendamento na Vigatti Estética:\n\n👤 *Nome:* ${nome}\n📱 *Telefone:* ${telefone}\n🚗 *Veículo:* ${veiculo.toUpperCase()}\n🧼 *Serviço:* ${servico}\n💰 *Valor:* R$ ${Number(valorFinal).toFixed(2).replace('.', ',')}\n📅 *Data:* ${dataFormatadaBr}\n⏰ *Horário:* ${selectedTime}`;
        
        setTimeout(() => {
          window.open(`https://wa.me/${whatsappDestino}?text=${encodeURIComponent(mensagem)}`, '_blank');
        }, 1500);
      }
    });

    function configurarEstrelas() {
      const stars = document.querySelectorAll('#ratingStars .star');
      stars.forEach(star => {
        star.addEventListener('click', () => {
          selectedRating = parseInt(star.getAttribute('data-value'));
          stars.forEach(s => {
            if (parseInt(s.getAttribute('data-value')) <= selectedRating) s.classList.add('active');
            else s.classList.remove('active');
          });
        });
      });
    }

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('reviewAlert');
      const nome = document.getElementById('reviewName').value;
      const texto = document.getElementById('reviewText').value;

      const { error } = await _supabase.from('avaliacoes').insert([{ nome, nota: selectedRating, texto }]);
      if (error) {
        exibirAlerta(alertBox, 'Erro ao enviar avaliação.', 'error');
      } else {
        exibirAlerta(alertBox, 'Avaliação enviada com sucesso!', 'success');
        document.getElementById('reviewForm').reset();
        carregarAvaliacoes();
      }
    });

    async function carregarAvaliacoes() {
      const list = document.getElementById('reviewsList');
      const { data: avaliacoes } = await _supabase.from('avaliacoes').select('*').order('created_at', { ascending: false });
      if (!avaliacoes || avaliacoes.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted);">Nenhuma avaliação ainda.</p>';
        return;
      }
      list.innerHTML = '';
      avaliacoes.forEach(r => {
        const estrelas = '★'.repeat(r.nota || 5) + '☆'.repeat(5 - (r.nota || 5));
        list.innerHTML += `<div class="review-item"><div class="review-header"><span style="font-weight:700;">${r.nome}</span><span class="review-stars">${estrelas}</span></div><p class="review-text">${r.texto}</p></div>`;
      });
    }

    function exibirAlerta(element, msg, type) {
      element.style.display = 'block';
      element.className = `alert alert-${type}`;
      element.innerText = msg;
      setTimeout(() => { element.style.display = 'none'; }, 5000);
    }
  </script>
</body>
</html>
